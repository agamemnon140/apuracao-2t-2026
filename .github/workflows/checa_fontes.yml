name: Checa fontes do TSE

# No apuracao-2t-2026 o cron fica DESLIGADO: na noite de 25/10 o runner local
# (runner/ciclo2t.py) e o unico escritor de docs/dados/live*. Dois escritores no mesmo
# arquivo rejeitariam os pushes um do outro. Disparo manual continua disponivel.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checa fontes e atualiza status
        run: python tools/checa_fontes.py docs/dados/live.json
      - name: Publica
        run: |
          git config user.name "checa-fontes[bot]"
          git config user.email "hrqnoronha@gmail.com"
          git add docs/dados/live.json
          git diff --cached --quiet || git commit -m "Status das fontes do TSE [skip ci]"
          git push
